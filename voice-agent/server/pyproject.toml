[project]
name = "kosmo-voice-agent"
version = "0.1.0"
description = "Kosmo voice agent: Deepgram STT, OpenRouter LLM and Rumik SILK TTS on Pipecat"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[deepgram,google,runner,silero,webrtc]",
    "pipecatcloud",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]